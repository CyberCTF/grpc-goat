# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# gRPC Goat (by rootxjs) as an Isoloom spec: nine vulnerable gRPC services, one machine each, built
# from the upstream source vendored unchanged (app/ and build/grpc-00N/app/) by upstream's
# Dockerfiles with the final image pinned. `isoloom generate`, then `isoloom up docker`.
version: 1
name: grpc-goat

networks:
  lab: { cidr: 10.60.34.0/24, internet: false }

machines:
  grpc-001:  # lab 001: gRPC reflection enabled
    networks: { lab: 10 }
    services: [{ port: 8001, name: grpc, publish: 8001 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: build/grpc-001

  grpc-002:  # lab 002: plaintext gRPC
    networks: { lab: 11 }
    services: [{ port: 8002, name: grpc, publish: 8002 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: build/grpc-002

  grpc-003:  # lab 003: insecure TLS
    networks: { lab: 12 }
    services: [{ port: 8003, name: grpc, publish: 8003 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: build/grpc-003

  grpc-004:  # lab 004: arbitrary mTLS
    networks: { lab: 13 }
    services: [{ port: 8004, name: grpc, publish: 8004 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: build/grpc-004

  grpc-005:  # lab 005: mTLS subject validation
    networks: { lab: 14 }
    services: [{ port: 8005, name: grpc, publish: 8005 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: build/grpc-005

  grpc-006:  # lab 006: world-writable Unix socket
    networks: { lab: 15 }
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: build/grpc-006

  grpc-007:  # lab 007: SQL injection
    networks: { lab: 16 }
    services: [{ port: 8007, name: grpc, publish: 8007 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: build/grpc-007

  grpc-008:  # lab 008: command injection
    networks: { lab: 17 }
    services: [{ port: 8008, name: grpc, publish: 8008 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: build/grpc-008

  grpc-009:  # lab 009: server-side request forgery
    networks: { lab: 18 }
    services: [{ port: 8009, name: grpc, publish: 8009 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: build/grpc-009

checks:
  - name: lab 002 answers a gRPC call (auth.AuthService/Login)
    script: checks/grpc-login.sh
    wait: 120
  - name: lab 003 answers over TLS
    http: https://grpc-003:8003/
    expect: any
  - name: lab 007 (SQL injection) listens
    tcp: grpc-007:8007

message: |
  gRPC Goat: nine labs, one gRPC service each, published on localhost:8001 to 8009 (8006 has no
  port: lab 006 is a Unix socket inside its machine, reach it with `isoloom connect grpc-006`).
  Start with lab 001: list the services with server reflection (grpcurl -plaintext
  localhost:8001 list). The .proto files for the other labs are in app/protos/.
